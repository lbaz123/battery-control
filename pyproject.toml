[project]
name = "battery-control"
version = "0.1.0"
description = "Battery storage control and optimisation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"